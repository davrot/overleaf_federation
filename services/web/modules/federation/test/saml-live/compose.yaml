# Test stack for the live SAML smoke (S20 Phase 2 "SAML live" item).
#
# Replaces the ad-hoc `docker run` of S20/S21 with one reproducible file:
# the same three services the ad-hoc stack ran (they are already on the
# host — this file documents/produces them):
#
#   fed-smoke-mongo    mongodb 127.0.0.1:27107  (User / ssoConfigs / audit rows)
#   fed-smoke-redis     redis    127.0.0.1:6380  (login rate limits, session set)
#   saml-idp          SimpleSAMLphp (kristophjunge/test-saml-idp) 127.0.0.1:8080
#
# The saml-idp bind-mounts the SMOKE SP registration below into the
# SimpleSAMLphp flatfile metadata dir — this is the SP-side registration a
# DFN/GEANT operator would submit, made reproducible. The file is the
# source of truth: `docker restart` preserves it.
#
# Bring up (from this directory):
#   docker compose up -d
# Tear down:  docker compose down
#
# NOTE: the IdP's signing cert (and the authsource users' attributes) are
# baked into the image; the harness reads the IdP metadata at RUNTIME
# (GET /simplesaml/saml2/idp/metadata.php) to obtain the signing cert, so
# a container restart does not need a re-run of manual recon.
#
# The SP flatfile registered here must match the harness ssoConfigs seed:
#   * entity id  https://smoke.example/saml
#   * ACS        https://smoke.example/saml/login/callback
#   * SLO        https://smoke.example/saml/logout/callback
# (the harness sets `Settings.siteUrl = https://smoke.example`; those are
#  the *published* URLs — the IdP container receives them from the
#  redirect and returns the SAMLResponse to them; the harness's fetch
#  rewrite maps our own origin (https://smoke.example) back to the live
#  local port.)
services:
  fed-smoke-mongo:
    image: mongo:7
    ports:
      - "27107:27017"
  fed-smoke-redis:
    image: redis:7
    ports:
      - "6380:6379"
  saml-idp:
    image: kristophjunge/test-saml-idp:latest
    ports:
      - "8080:8080"
    volumes:
      # Our smoke-SP registration into the IdP's flatfile metadata dir
      - ./idp/saml20-sp-remote.php:/var/www/simplesamlphp/metadata/saml20-sp-remote.php
    environment:
      # IdP debug off (2 = default; keep logs for ops)
      - SIMPlesAMLphp_debug
